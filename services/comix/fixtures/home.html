usin. \r\n\r\n“Clover, iz okay.” \r\n\r\nEven so, Clover never let herself be discouraged. Because someday, her dad would come and get her. \r\n\r\n[August 2. Sunny. Auntie got mad again. She told me not to tell Dad.] \r\n\r\nSo Clover kept a diary in preparation for that day and practiced her power as hard as she could, hoping to show it to her father when he finally came. \r\n\r\nBut… \r\n\r\n“Dad, when are you coming?” \r\n\r\nThe mistreatment from her mother’s family only grew worse with each passing day, and even after Clover had filled ten pages of her diary, her father still hadn’t come. Clover had always firmly believed that one day he would return for her. But just as she began to wonder whether she had truly been abandoned for good… \r\n\r\n“Clover, Dad’s here.” \r\n\r\nHer father appeared. And he came exactly the way Clover had always dreamed he would. \r\n\r\n=\r\n\r\nThere was something Clover’s cruel aunt always told her. \r\n\r\nThat Clover was useless and that her power was insignificant. \r\n\r\nThat even if she returned home, her family would surely hate her. \r\n\r\nBut… \r\n\r\n“Even if you had no power at all, I would have loved you just the same. Because you’re my daughter.” \r\n\r\nHer father turned out to be far gentler and more affectionate than Clover had ever imagined. \r\n\r\n“Sweet pea, want to sit next to me? Should your big brother feed you?”    \r\n“My little sister, I’ve waited such a long time for the day I could finally meet you.” \r\n\r\nHer two older brothers warmly welcomed Clover home. \r\n\r\n“Clover, as long as I’m here, no one will ever lay a hand on you.” \r\n\r\n…And then there was her older sister, who might have been a little overprotective, but cherished and loved Clover all the same. \r\n\r\nSurrounded by a loving family, Clover began to think: Maybe Auntie had been wrong after all! \r\n\r\n=\r\n\r\nRemember, Clover: A sprout is what a flower used to be. The wonderful coming-of-age story of little Clover, a tiny sprout destined to bloom!\r\n\r\n**Original Webtoon:**   \r\n[KakaoPage](https://page.kakao.com/content/70324004), [Daum](https://webtoon.kakao.com/content/%EC%95%85%EB%8B%B9-%EA%B3%B5%EC%9E%91%EA%B0%80%EC%97%90-%ED%94%BC%EC%96%B4%EB%82%9C-%EC%83%88%EC%8B%B9-%EC%95%84%EA%B8%B0%EB%8B%98/4966)","synopsisHtml":"Clover, a child born without the power of her family’s bloodline. Because she possessed no special ability, she was sent to live with her mother’s family, where she grew up enduring the cruelty of her wicked aunt and older cousin. \u003Cbr\u003E\r\n\u003Cbr\u003E\r\n“Clover, iz okay.” \u003Cbr\u003E\r\n\u003Cbr\u003E\r\nEven so, Clover never let herself be discouraged. Because someday, her dad would come and get her. \u003Cbr\u003E\r\n\u003Cbr\u003E\r\n[August 2. Sunny. Auntie got mad again. She told me not to tell Dad.] \u003Cbr\u003E\r\n\u003Cbr\u003E\r\nSo Clover kept a diary in preparation for that day and practiced her power as hard as she could, hoping to show it to her father when he finally came. \u003Cbr\u003E\r\n\u003Cbr\u003E\r\nBut… \u003Cbr\u003E\r\n\u003Cbr\u003E\r\n“Dad, when are you coming?” \u003Cbr\u003E\r\n\u003Cbr\u003E\r\nThe mistreatment from her mother’s family only grew worse with each passing day, and even after Clover had filled ten pages of her diary, her father still hadn’t come. Clover had always firmly believed that one day he would return for her. But just as she began to wonder whether she had truly been abandoned for good… \u003Cbr\u003E\r\n\u003Cbr\u003E\r\n“Clover, Dad’s here.” \u003Cbr\u003E\r\n\u003Cbr\u003E\r\nHer father appeared. And he came exactly the way Clover had always dreamed he would. \u003Cbr\u003E\r\n\u003Cbr\u003E\r\n=\u003Cbr\u003E\r\n\u003Cbr\u003E\r\nThere was something Clover’s cruel aunt always told her. \u003Cbr\u003E\r\n\u003Cbr\u003E\r\nThat Clover was useless and that her power was insignificant. \u003Cbr\u003E\r\n\u003Cbr\u003E\r\nThat even if she returned home, her family would surely hate her. \u003Cbr\u003 y would surely hate her. \r\n\r\nBut… \r\n\r\n“Even if you had no power at all, I would have loved you just the same. Because you’re my daughter.” \r\n\r\nHer father turned out to be far gentler and more affectionate than Clover had ever imagined. \r\n\r\n“Sweet pea, want to sit next to me? Should your big brother feed you?”    \r\n“My little sister, I’ve waited such a long time for the day I could finally meet you.” \r\n\r\nHer two older brothers warmly welcomed Clover home. \r\n\r\n“Clover, as long as I’m here, no one will ever lay a hand on you.” \r\n\r\n…And then there was her older sister, who might have been a little overprotective, but cherished and loved Clover all the same. \r\n\r\nSurrounded by a loving family, Clover began to think: Maybe Auntie had been wrong after all! \r\n\r\n=\r\n\r\nRemember, Clover: A sprout is what a flower used to be. The wonderful coming-of-age story of little Clover, a tiny sprout destined to bloom!\r\n\r\n**Original Webtoon:**   \r\n[KakaoPage](https://page.kakao.com/content/70324004), [Daum](https://webtoon.kakao.com/content/%EC%95%85%EB%8B%B9-%EA%B3%B5%EC%9E%91%EA%B0%80%EC%97%90-%ED%94%BC%EC%96%B4%EB%82%9C-%EC%83%88%EC%8B%B9-%EC%95%84%EA%B8%B0%EB%8B%98/4966)","synopsisHtml":"Clover, a child born without the power of her family’s bloodline. Because she possessed no special ability, she was sent to live with her mother’s family, where she grew up enduring the cruelty of her wicked aunt and older cousin. \u003Cbr\u003E\r\n\u003Cbr\u003E\r\n“Clover, iz okay.” \u003Cbr\u003E\r\n\u003Cbr\u003E\r\nEven so, Clover never let herself be discouraged. Because someday, her dad would come and get her. \u003Cbr\u003E\r\n\u003Cbr\u003E\r\n[August 2. Sunny. Auntie got mad again. She told me not to tell Dad.] \u003Cbr\u003E\r\n\u003Cbr\u003E\r\nSo Clover kept a diary in preparation for that day and practiced her power as hard as she could, hoping to show it to her father when he finally came. \u003Cbr\u003E\r\n\u003Cbr\u003E\r\nBut… \u003Cbr\u
